modLoader = "javafml"
loaderVersion = "${fml_dependency}"
issueTrackerURL = "${issues_page}"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"

authors = "GabehEPW"
credits = "Original concept by konwboj (Magic Clover)"

displayURL = "${home_page}"
description = '''${description}'''
logoFile = "icon.png"

[[mixins]]
config = "lucky_clover_reborn.mixins.json"

[[dependencies."${id}"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"
